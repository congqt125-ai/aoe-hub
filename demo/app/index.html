<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperAge Hub — bản mẫu</title>
<style>
  /* Fixed 1600x900 stage: never resizes with the window (scrolls if the window is smaller, centred if larger).
     The transform makes the stage the containing block of position:fixed overlays (Dialog, toasts). */
  html, body { margin: 0; background: #000; }
  /* padding-right = the review rail, so the rail never covers the stage. */
  body { min-width: 1640px; min-height: 900px; display: flex; box-sizing: border-box; padding-right: 40px; }
  #root { position: relative; flex: none; width: 1600px; height: 900px; margin: auto; overflow: hidden; transform: translateZ(0); }
  /* Review-only tool rail at the window edge (demo/app/ReviewRail.tsx + demo/shared/tuner.js mount into it);
     each screen shows only its own tools. Horizontal buttons stacked from the bottom up (tuner lowest), right-aligned:
     a long button runs left over the stage (user, 13/11). The open panel sits on top of the stack. */
  #review-rail { position: fixed; top: 0; right: 0; bottom: 0; width: 40px; box-sizing: border-box; z-index: 2147483000;
                 display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 6px;
                 padding: 8px 4px; background: #0b0907; border-left: 1px solid #fff2; }
</style>
</head>
<body>
<div id="root" class="surface-screen-bg"></div>
<aside id="review-rail" aria-label="Công cụ duyệt bản mẫu"></aside>
<script type="module" src="./main.tsx"></script>
</body>
</html>
